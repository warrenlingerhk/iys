

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IYS — Admin</title>
<link rel="icon" type="image/png" href="/images/IYS%20Logo.png">
<style>
  :root{--navy:#00459A;--magenta:#D600D6;--bg:#f0f2f5;--card:#fff;--muted:#5b6b7f;--red:#c62828;--amber:#b7791f;--green:#1b7f3b;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;}
  body{background:var(--bg);color:var(--navy);padding:24px;}
  header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--magenta);padding-bottom:14px;margin-bottom:22px;}
  header h1{font-size:1.5rem;} header h1 span{color:var(--magenta);}
  .pill{background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:8px 18px;font-weight:700;text-decoration:none;}
  h2{margin:26px 0 10px;font-size:1.15rem;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:12px 0 8px;}
  .card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 2px 6px rgba(0,20,60,.08);}
  .card b{font-size:1.6rem;display:block;margin-bottom:4px;} .card span{color:var(--muted);font-size:.85rem;}
  .row{background:var(--card);border-radius:10px;padding:8px 12px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,20,60,.08);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;}
  .muted{color:var(--muted);font-size:.9rem;}
  button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:.85rem;}
  button[disabled]{opacity:.35;cursor:not-allowed;}
  .btn-magenta{background:var(--magenta);color:#fff;} .btn-navy{background:var(--navy);color:#fff;}
  .btn-ghost{background:#fff;color:var(--navy);border:2px solid var(--navy);} .btn-red{background:var(--red);color:#fff;}
  .btn-mini{padding:5px 8px;font-size:.68rem;line-height:1.15;border-radius:8px;white-space:normal;min-width:56px;text-align:center;}
  .badge{border-radius:6px;padding:2px 8px;font-size:.7rem;font-weight:700;margin-left:6px;color:#fff;background:var(--navy);}
  .badge.m{background:var(--magenta);} .badge.r{background:var(--red);} .badge.p{background:var(--amber);} .badge.g{background:var(--green);}
  .chip{background:#eef2f7;border-radius:8px;padding:3px 9px;font-size:.72rem;font-weight:800;color:var(--navy);display:inline-block;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dot.on{background:#1b7f3b;box-shadow:0 0 6px rgba(27,127,59,.7);}
  .dot.off{background:#d3dce6;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dot.on{background:var(--green);box-shadow:0 0 6px rgba(27,127,59,.7);}
  .dot.off{background:#d3dce6;}
  label.chk{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted);font-weight:600;}
  #login{max-width:360px;margin:10vh auto;background:#fff;padding:26px;border-radius:12px;box-shadow:0 4px 14px rgba(0,20,60,.12);}
  #login h1{margin-bottom:14px;} #login h1 span{color:var(--magenta);}
  input{width:100%;padding:10px;margin:6px 0 12px;border:2px solid #dfe6ee;border-radius:8px;font-size:.95rem;}
  .hidden{display:none;} .post-ex{background:#f5f7fa;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:.85rem;color:var(--muted);max-width:520px;}
</style>
</head>
<body>

<div id="login" class="hidden">
  <h1>IYS <span>Admin</span></h1>
  <input id="li-email" type="email" placeholder="Email">
  <input id="li-pass" type="password" placeholder="Password">
  <button class="btn-navy" onclick="doLogin()">Log in</button>
  <p id="li-err" class="muted" style="margin-top:10px;"></p>
</div>

<div id="dash" class="hidden">
  <header>
    <h1>IYS <span>Admin</span></h1>
    <a class="pill" href="/">&#8592; Back to site</a>
  </header>
  <h2 style="margin-top:0;font-size:1.6rem;">Admin Dashboard</h2>
  <div class="cards" id="stats"></div>
  <h2>Analytics</h2><div class="cards" id="analytics"></div>
  <h2>Classmates — full member list</h2><div id="members"></div>
  <h2>Reports</h2><div id="reports"></div>
</div>

<script>
const KEYS=['iys_token','token'];
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let TOKEN='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isOnline(ls){ if(!ls) return false; const t=Date.parse(String(ls).replace(' ','T')+'Z'); return !isNaN(t) && (Date.now()-t) < 5*60000; }
async function api(path,opts={}){
  return fetch(path,{method:opts.method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:opts.body?JSON.stringify(opts.body):undefined});
}
async function getJSON(path){const r=await api(path);if(!r.ok)return null;try{return await r.json();}catch(e){return null;}}
async function statsStatus(t){try{const r=await fetch('/api/admin/stats',{headers:{'Authorization':'Bearer '+t}});return r.status;}catch(e){return 0;}}
async function findToken(){
  const cands=[];
  for(const k of KEYS){const v=localStorage.getItem(k);if(v&&UUID.test(v)&&!cands.includes(v))cands.push(v);}
  for(let i=0;i<localStorage.length;i++){const v=localStorage.getItem(localStorage.key(i));if(v&&UUID.test(v)&&!cands.includes(v))cands.push(v);}
  for(const t of cands){if(await statsStatus(t)===200)return t;}
  return '';
}
function showLogin(msg){$('login').classList.remove('hidden');$('dash').classList.add('hidden');$('li-err').textContent=msg||'';}
function showDash(){$('login').classList.add('hidden');$('dash').classList.remove('hidden');loadAll();}
async function boot(){
  TOKEN=await findToken();
  if(TOKEN){showDash();return;}
  showLogin('');
}
async function doLogin(){
  const r=await api('/api/login',{method:'POST',body:{email:$('li-email').value,password:$('li-pass').value}});
  const j=await r.json();
  if(!r.ok){showLogin(j.error||'Login failed.');return;}
  TOKEN=j.token;KEYS.forEach(k=>localStorage.setItem(k,j.token));
  if(await statsStatus(TOKEN)===200){showDash();return;}
  showLogin('Login worked, but this account does not have admin access.');
}
async function act(path,body){const r=await api(path,{method:'POST',body});if(!r.ok){const j=await r.json();alert(j.error||'Action failed.');}loadAll();}
function setStatus(id,status){act('/api/admin/status',{user_id:id,status});}
function isOnline(ls){ if(!ls) return false; const t=Date.parse(String(ls).replace(' ','T')+'Z'); return !isNaN(t) && (Date.now()-t) < 5*60000; }
async function loadAll(){
  const [stats,analytics,users,reports]=await Promise.all([
    getJSON('/api/admin/stats'),getJSON('/api/admin/analytics'),
    getJSON('/api/admin/users'),getJSON('/api/admin/reports')]);
  $('stats').innerHTML=stats?
    `<div class="card"><b>${stats.users||0}</b><span>Members</span></div>
     <div class="card"><b>${stats.posts||0}</b><span>Posts</span></div>
     <div class="card"><b>${stats.reports||0}</b><span>Open reports</span></div>
     <div class="card"><b>${stats.active||0}</b><span>Active users (last 5 min)</span></div>`
    :'<p class="muted">Stats unavailable — are you still logged in?</p>';
  $('analytics').innerHTML=analytics?
    `<div class="card"><b>${analytics.totalUsers||0}</b><span>Total users</span></div>
     <div class="card"><b>${analytics.activeLearners||0}</b><span>Active learners</span></div>
     <div class="card"><b>${analytics.eliteRate||0}%</b><span>Completion rate (1+ lesson)</span></div>
     <div class="card"><b>${analytics.engagement||0}</b><span>Engagement</span></div>
     <div class="card"><b>${analytics.healthRatio||0}</b><span>Health ratio</span></div>`:'';
  $('members').innerHTML=(Array.isArray(users)&&users.length)?users.map(u=>{
    const sb=u.status==='Approved'?'g':(u.status==='Banned'?'r':'p');
    const on=isOnline(u.last_seen);
    return `<div class="row"><div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
      <b>#${esc(u.member_number)} ${esc(u.name)}</b>
      <span class="dot ${isOnline(u.last_seen)?'on':'off'}" title="${isOnline(u.last_seen)?'On the site now':'Last seen '+(u.last_seen||'never')}"></span>
      <span class="badge ${sb}">${esc(u.status||'Pending').toUpperCase()}</span>
      <span class="badge ${sb}">${esc(u.status||'Pending').toUpperCase()}</span>
      ${u.is_admin?'<span class="badge m">ADMIN</span>':''}
      <span class="chip">Posts ${u.post_count||0}</span><span class="chip">Modules ${u.modules_done||0}</span><span class="chip">Lessons ${u.lessons_done||0}</span>
      <span class="muted">${esc(u.email)} &middot; joined ${esc((u.created_at||'').slice(0,10))}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
        <button class="btn-navy btn-mini" ${u.status==='Approved'?'disabled':''} onclick="setStatus(${u.id},'Approved')">Approve</button>
        <button class="btn-ghost btn-mini" ${u.status==='Pending'?'disabled':''} onclick="setStatus(${u.id},'Pending')">Pending</button>
        <button class="btn-red btn-mini" ${u.status==='Banned'?'disabled':''} onclick="setStatus(${u.id},'Banned')">Banned</button>
        <label class="chk"><input type="checkbox" ${u.is_admin?'checked':''} onchange="act('/api/admin/set-admin',{user_id:${u.id},is_admin:this.checked?1:0})"> Admin</label>
        <button class="btn-ghost btn-mini" onclick="resetPw(${u.id})">Reset PW</button>
      </div></div>`;}).join('')
    :'<p class="muted">No members yet.</p>';
  $('reports').innerHTML=Array.isArray(reports)?(reports.length?reports.map(r=>
    `<div class="row" style="display:block;"><div class="muted">${esc(r.reporter_name||'?')} reported ${esc(r.reported_user_name||'?')} &middot; ${esc((r.created_at||'').slice(0,10))} ${r.resolved?'<span class="badge">RESOLVED</span>':''}</div>
     <div class="post-ex">${esc(r.post_content||'(post deleted)')}</div>
     <div class="muted" style="margin-bottom:8px;">Reason: ${esc(r.reason||'—')}</div>
     <div style="display:flex;gap:8px;flex-wrap:wrap;">
       <button class="btn-navy" onclick="act('/api/admin/reports/resolve',{report_id:${r.id},resolved:${r.resolved?0:1}})">${r.resolved?'Reopen':'Resolve'}</button>
       ${r.post_id?`<button class="btn-red" onclick="act('/api/posts/delete',{post_id:${r.post_id}})">Delete post</button>`:''}
       <button class="btn-ghost" onclick="act('/api/admin/reports/delete',{report_id:${r.id}})">Delete report</button>
     </div></div>`).join(''):'<p class="muted">No reports. 🎉</p>')
    :'<p class="muted">Reports unavailable.</p>';
}
async function resetPw(id){const pw=prompt('New password for this member (8+ characters):');if(!pw)return;act('/api/admin/reset-password',{user_id:id,new_password:pw});}
setInterval(function(){ if(TOKEN) api('/api/heartbeat').catch(function(){}); }, 60000);
setInterval(function(){ if(TOKEN && !$('dash').classList.contains('hidden')) loadAll(); }, 60000);
boot();
</script>
</body>
</html>
